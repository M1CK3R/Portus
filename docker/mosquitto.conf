# PORTUS Fase 2 — broker para Docker (docker-compose.yml, docs/docker.md).
# Mismos listeners y ACL que config/mosquitto.conf, con dos diferencias:
#   - El archivo de contraseñas lo genera iniciar_mosquitto.sh desde
#     config/portus.env en cada arranque: no hay que correr mosquitto_passwd.
#   - El registro va a stdout (docker compose logs mosquitto).
# Los contenedores usan la red del host, así que 127.0.0.1 es la Raspberry.

# Usuarios y ACL comunes a los dos listeners (mosquitto 2.1 desaconseja
# per_listener_settings, y aquí ambos usan la misma autenticación).
allow_anonymous false
password_file /run/portus/passwd_mosquitto
acl_file /run/portus/acl_portus

# TCP 1883 para los servicios internos (puente, web, mensajería). Solo
# localhost: ningún equipo de la red lo necesita.
listener 1883 127.0.0.1
protocol mqtt

# WebSocket 9001 para el sinóptico del navegador (§5.5): abierto a la red local.
listener 9001 0.0.0.0
protocol websockets

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
