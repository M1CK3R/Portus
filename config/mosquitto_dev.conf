# PORTUS Fase 2 — broker de DESARROLLO (máquina local / WSL)
# Igual en espíritu a mosquitto.conf (producción en el SBC) pero pensado para
# correr en primer plano, como tu propio usuario, sin sudo ni systemd:
#
#   mosquitto_passwd -c config/passwd_mosquitto portus-puente      # -c SOLO el primero
#   mosquitto_passwd -b config/passwd_mosquitto portus-tablero <clave>
#   mosquitto -c config/mosquitto_dev.conf -v
#
# Diferencias con producción:
#   - Solo escucha en 127.0.0.1 (nada accesible desde la red).
#   - Rutas relativas al proyecto: ejecutar mosquitto desde la RAÍZ del repo.
#   - El archivo de contraseñas es de tu usuario y el broker también corre
#     como tu usuario, así que no hay problema de propiedad (en producción
#     el archivo debe ser del usuario «mosquitto»: ver README §Ejecución).

per_listener_settings true

# TCP para los servicios internos (puente, web, herramientas)
listener 1883 127.0.0.1
protocol mqtt
allow_anonymous false
password_file config/passwd_mosquitto
acl_file config/acl_portus

# WebSocket para el sinóptico del navegador (mismo requisito §5.5)
listener 9001 127.0.0.1
protocol websockets
allow_anonymous false
password_file config/passwd_mosquitto
acl_file config/acl_portus

persistence false
log_dest stdout
