# PORTUS Fase 2 — configuración de Mosquitto (SPECS §5.5, §19.2)
# Requisito obligatorio: listener TCP 1883 Y listener MQTT sobre WebSocket,
# sin él el navegador no puede suscribirse y el sinóptico caería en polling.
#
# Instalación (SBC, ruta /opt/portus según SPECS §19.2):
#   sudo mkdir -p /opt/portus/config
#   sudo mosquitto_passwd -c /opt/portus/config/passwd_mosquitto portus-puente
#   sudo mosquitto_passwd -b /opt/portus/config/passwd_mosquitto portus-web <contrasena>
#   sudo mosquitto_passwd -b /opt/portus/config/passwd_mosquitto portus-msg <contrasena>
#   sudo mosquitto_passwd -b /opt/portus/config/passwd_mosquitto portus-tablero <contrasena>
#   sudo cp acl_portus /opt/portus/config/
#   # El servicio corre como usuario «mosquitto» y lee estos archivos tras
#   # soltar privilegios: si quedan de root sin lectura para él, el broker
#   # muere con «Unable to open pwfile»:
#   sudo chown mosquitto:mosquitto /opt/portus/config/passwd_mosquitto /opt/portus/config/acl_portus
#   sudo chmod 600 /opt/portus/config/passwd_mosquitto
#   sudo chmod 640 /opt/portus/config/acl_portus
#   sudo cp mosquitto.conf /etc/mosquitto/conf.d/portus.conf
#   sudo systemctl restart mosquitto
#
# El prefijo portus es obligatorio y exacto (SPECS §5.1): la ACL de abajo
# restringe cada cliente a los tópicos que construyen con TOPIC_PREFIX.

per_listener_settings true

# Listener TCP 1883 para los servicios internos (puente, web, mensajería)
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous false
password_file /opt/portus/config/passwd_mosquitto
acl_file /opt/portus/config/acl_portus

# Listener MQTT sobre WebSocket 9001 para el sinóptico del navegador
listener 9001 0.0.0.0
protocol websockets
allow_anonymous false
password_file /opt/portus/config/passwd_mosquitto
acl_file /opt/portus/config/acl_portus

persistence false
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
connection_messages true
