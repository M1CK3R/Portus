[Unit]
Description=PORTUS - puente serial <-> MQTT
Documentation=file:///opt/portus/docs/protocolo_serial.md
# Orden de arranque exigido (SPECS §19.2): mosquitto -> portus-web -> portus-bridge -> portus-msg
After=network.target mosquitto.service portus-web.service
Wants=mosquitto.service

[Service]
Type=simple
User=portus
Group=portus
# El usuario portus debe pertenecer al grupo dialout para el puerto serie:
#   sudo usermod -aG dialout portus
WorkingDirectory=/opt/portus
ExecStart=/opt/portus/venv/bin/python -m puente --config /opt/portus/config/portus.env
Restart=always
RestartSec=3
StandardOutput=journal
StandardError=journal

[Install]
WantedBy=multi-user.target
