<section id="citas">
  <label for="citas-fecha">Día:</label>
  <input id="citas-fecha" type="date">
  <div id="citas-cumplimiento" class="indicador-dia"></div>
  <h2>Agenda del día (§14.5)</h2>
  <form id="citas-bloquear" class="fila-formulario">
    <label for="citas-bloquear-hora">Bloquear franja (aunque no tenga citas):</label>
    <input id="citas-bloquear-hora" type="time" step="900" required>
    <button type="submit" class="boton boton-chico">Bloquear</button>
  </form>
  <div id="citas-franjas" class="franjas"></div>
  <h2>Vinculación de transportistas (A17)</h2>
  <div id="citas-vinculacion" class="lista-datos"></div>
  <div id="citas-error"></div>
</section>
